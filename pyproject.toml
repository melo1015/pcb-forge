[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-forge"
version = "0.1.0"
description = "Multi-agent MCP workflow for KiCad project generation and validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0,<2.0.0",
  "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
circuit-synth = [
  "circuit-synth",
]

[project.scripts]
pcb-forge-mcp = "pcb_forge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
