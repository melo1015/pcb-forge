name: Circuit-Synth + KiCad E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  circuit-synth-kicad:
    # Register a trusted self-hosted Linux runner with this label. KiCad CLI
    # must be installed on the runner; Circuit-Synth is installed by this job.
    runs-on: [self-hosted, linux, pcb-forge-e2e]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify KiCad CLI
        run: |
          python --version
          kicad-cli version
      - name: Install PCB Forge and Circuit-Synth
        run: python -m pip install -e ".[dev,circuit-synth]"
      - name: Verify Circuit-Synth
        run: python -c "import circuit_synth; print('Circuit-Synth import OK')"
      - name: Generate 5V regulator and run KiCad ERC/DRC commands
        run: python scripts/run_circuit_synth_e2e.py examples/circuit_synth/regulator_5v.py
